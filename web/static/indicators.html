<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategie indicatori</title><link rel="stylesheet" href="/static/style.css?v=6"><link rel="stylesheet" href="/static/indicators.css?v=1"></head><body><header><div><strong>Strategie a indicatori</strong><span>Paper separato - nessun modello ML, nessun ordine al broker</span></div><a href="/" style="color:#7dd3fc">Portafogli modello</a></header><main><h2>Strategie attive</h2><p class="meta">T: trend EMA20/50 + MACD. U: RSI14 + Bollinger mean reversion. V: breakout Donchian 20.</p><div id="cards"></div></main><script>
const descriptions={T:'Trend following: apre LONG quando EMA20 e sopra EMA50 con MACD positivo; SHORT nella condizione opposta. Cerca movimenti direzionali, non inversioni.',U:'Mean reversion: cerca LONG quando RSI14 e ipervenduto e il prezzo e sotto la banda di Bollinger; SHORT nel caso speculare. Funziona meglio in range, soffre i trend forti.',V:'Breakout: apre LONG quando il prezzo supera il massimo delle 20 candele precedenti, SHORT sotto il minimo. Cerca accelerazioni, ma puo subire falsi breakout.'};
const f=n=>Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
async function load(){try{const d=await (await fetch('/api/indicators')).json();document.querySelector('#cards').innerHTML=d.cards.map(c=>`<article class="card indicator-card" data-tooltip="${descriptions[c.strategy]||''}"><h3>${c.name}</h3><div class="pnl ${c.total_pnl>=0?'plus':'minus'}">${c.total_pnl>=0?'+':''}${f(c.total_pnl)} USD</div><div class="meta">trade ${c.trades} - posizioni ${c.open_positions}<br>${c.last_signal||'N/D'}: ${c.last_reason||''}</div></article>`).join('')}catch(e){document.querySelector('#cards').textContent='Errore: '+e.message}}load();setInterval(load,5000)
</script></body></html>
