[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-realtime-chart"
version = "0.0.1"
description = "Persistent realtime Plotly chart for XAUUSD TradingLab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "XAUUSD TradingLab", email = "local@example.invalid" }]
dependencies = ["streamlit >= 1.51"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["xauusd_realtime_chart*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
xauusd_realtime_chart = ["frontend/build/**/*", "pyproject.toml"]
